name: Python tests
on:
  push:
    branches: [main, "refactor/**", "feature/colab-pipeline-execution"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  canonical-pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.18"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q src scripts tests
      - name: Run post-hoc empirical monotonicity verifier on synthetic fixture
        run: >-
          python -m src.set_forecasting.validation.empirical_monotonicity
          --synthetic-fixture
          --report-path /tmp/empirical_monotonicity_audit.json
          --violations-path /tmp/empirical_monotonicity_violations.csv
      - name: Run active SCMD, RADCSR, Colab and visualization tests
        run: >-
          python -m pytest -q
          tests/test_scmd_phase1.py
          tests/test_scmd_phases_2_4.py
          tests/test_set_forecasting_radcsr.py
          tests/test_colab_runtime.py
          tests/test_colab_notebook_contract.py
          tests/test_visualization.py
          tests/test_requested_correctness_fixes.py

  legacy-compatibility-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.18"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Run retained historical implementation regression tests
        run: >-
          python -m pytest -q
          tests/test_pipeline_units.py
          tests/test_scmd_phases_5_8.py
          tests/test_scmd_review_fixes.py
