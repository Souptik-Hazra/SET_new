name: Python tests
on:
  push:
    branches: [main, "refactor/**", "feature/colab-pipeline-execution"]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  canonical-pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q src scripts tests
      - run: >-
          python -m pytest -q
          tests/test_scmd_phase1.py
          tests/test_scmd_phases_2_4.py
          tests/test_pipeline_units.py
          tests/test_set_forecasting_radcsr.py
          tests/test_colab_runtime.py
