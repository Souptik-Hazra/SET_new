seed: 42

data:
  granularity: weekly          # daily | weekly
  min_periods: 18
  min_nonzero: 6
  outlier_iqr_multiplier: 3.0
  winsorize_quantile: 0.99
  quantity_col: Sheet          # column used as dispensed quantity
  date_col: addeddate
  medicine_col: name
  type_filter: Drug            # keep only rows where type == Drug

forecast:
  horizon: 1
  quantiles: [0.10, 0.50, 0.90]
  train_frac: 0.60
  val_frac: 0.20
  test_frac: 0.20

reliability:
  window: 8
  cusum_k: 0.5
  cusum_h: 5.0
  adwin_delta: 0.002
  ewma_lambda: 0.9
  aci_gamma: 0.01
  target_coverage: 0.90

inventory:
  init_stock_days: 30
  reorder_point_days: 20
  target_cover_days: 45
  lead_time_days: [5, 6, 7]
  service_level: 0.95

radcsr:
  weights: {error: 0.30, bias: 0.30, coverage: 0.25, drift: 0.15}
  kappa: 0.5
  beta: 1.0
  gamma_max: 2.0
  tau_risk: 0.30
  tau_reliability: 0.50

scenarios:
  surge_multiplier: [1.5, 2.0]
  surge_duration: [2, 4]
  drift_rate: [0.01, 0.03]
  volatility_multiplier: [2.0, 3.0]
  bias_offset_std: 1.0
