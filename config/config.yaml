seed: 42
data:
  source: data/combined_secondary_care_medicines.csv
  engine: duckdb
  granularity: monthly
  period_col: YEAR_MONTH
  organisation_col: ODS_CODE
  medicine_col: VMP_SNOMED_CODE
  product_name_col: VMP_PRODUCT_NAME
  unit_id_col: UNIT_OF_MEASURE_IDENTIFIER
  unit_name_col: UNIT_OF_MEASURE_NAME
  quantity_col: TOTAL_QUANITY_IN_VMP_UNIT
  cost_col: INDICATIVE_COST
  min_periods: 18
  min_nonzero: 6
  outlier_iqr_multiplier: 3.0
  train_frac: 0.60
  val_frac: 0.20
  test_frac: 0.20
forecast:
  horizon: 1
  seasonal_period: 12
  quantiles: [0.10, 0.50, 0.90]
  model: global_quantile_lightgbm
reliability:
  window: 8
  target_coverage: 0.90
  min_history: 3
inventory:
  granularity: monthly
  init_stock_months: 1
  reorder_point_months: 1
  target_cover_months: 2
  lead_time_months: [1, 2, 3]
  service_level: 0.95
  outcomes_are_simulated: true
radcsr:
  weights: {error: 0.30, bias: 0.30, coverage: 0.25, drift: 0.15}
  kappa: 0.5
  beta: 1.0
  gamma_max: 2.0
  tau_risk: 0.30
  tau_reliability: 0.50
scenarios:
  surge_multiplier: [1.5, 2.0]
  surge_duration_months: [2, 4]
  drift_rate: [0.01, 0.03]
  volatility_multiplier: [2.0, 3.0]
  bias_offset_std: 1.0
