[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "setreliable-scmd"
version = "0.1.0"
description = "SCMD demand forecasting and RADCSR reliability-adaptive shortage risk research"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2,<3.0",
  "duckdb>=1.1",
  "pyarrow>=17",
  "PyYAML>=6.0",
  "scipy>=1.11",
  "lightgbm>=4.0",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
markers = [
  "legacy: tests for the historical pharmacy-schema implementation, not the active SCMD pipeline",
]
